# Saurav Shop Vendure Pipeline

name: Build and Push Docker Image

on:
  push:
    branches: [main, feat/pipeline]   # feat/pipeline still temporary for testing
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
          image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update_manifest:
      name: Update Kubernetes Image Tag
      runs-on: ubuntu-latest
      needs: build_push
      env:
        IMAGE_TAG: ${{ needs.build_push.outputs.image_tag }}
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Update image tag in values.yaml
          run: |
            echo "Updating image to:"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
            yq -i '
              .image.repository = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" |
              .image.tag = "'"${IMAGE_TAG}"'"
            ' helm/saurav-shop/values.yaml

        - name: Verify updated values.yaml
          run: |
            echo "Updated values.yaml:"
            cat helm/saurav-shop/values.yaml
