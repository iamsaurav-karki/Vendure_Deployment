# Namespace the chart deploys into
namespace: saurav-shop
image:
  repository: ghcr.io/iamsaurav-karki/vendure-deployment-assignment-devops
  tag: 8cfc1d8
  pullPolicy: IfNotPresent
server:
  replicas: 1
  port: 3000
  service:
    type: NodePort
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
worker:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
config:
  appEnv: production
  dbHost: postgres
  dbPort: "5432"
  dbName: vendure
  dbSchema: public
# Secrets are NOT set here. Provide them at install time via
# --set-string or a separate untracked values file 
secrets:
  postgresUser: ""
  postgresPassword: ""
  postgresDb: ""
  dbUsername: ""
  dbPassword: ""
  cookieSecret: ""
  superadminUsername: ""
  superadminPassword: ""
