apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saurav-shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: app-worker
  template:
    metadata:
      labels:
        app: app-worker
    spec:
      containers:
        - name: app-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/index-worker.js"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
